<svg width="925" height="440" viewBox="0 0 925 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Currently exploring</title>
<desc>Six cards: agentic AI, advanced RAG, edge AI, vision-language AI, MCP, AI automation</desc>

